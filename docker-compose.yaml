services:
  postgres:
    image: pgvector/pgvector:pg18
    container_name: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./backend/docker/database:/docker-entrypoint-initdb.d:ro
    ports:
      - "${DB_PORT}:${DB_PORT}"
    command: >
      sh -c "
        apt-get update &&
        apt-get install -y --no-install-recommends tzdata &&
        docker-entrypoint.sh postgres
      "
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "${MQ_PORT}:${MQ_PORT}"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    restart: always

  worker:
    build:
      context: ./backend
      dockerfile: ./docker/Dockerfile
    container_name: worker
    command: ["./worker"]
    environment:
      DATABASE_URL: "host=${DB_HOST} user=${POSTGRES_USER} password=${POSTGRES_PASSWORD} dbname=${POSTGRES_DB} port=${DB_PORT} sslmode=${POSTGRES_SSLMODE}"
      PORT: ${BACKEND_PORT}
      JWT_KEY: ${JWT_KEY}
      JWT_EXPIRE_TIME: ${JWT_EXPIRE_TIME}
      JWT_REFRESH_TIME: ${JWT_REFRESH_TIME}
      QWEN_API_KEY: ${QWEN_API_KEY}
      QWEN_BASE_URL: ${QWEN_BASE_URL}
      RABBITMQ_URL: ${RABBITMQ_URL}
    volumes:
      - file_assets:/assets
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_started
    restart: always

  backend:
    build:
      context: ./backend
      dockerfile: ./docker/Dockerfile
    container_name: backend
    environment:
      DATABASE_URL: "host=${DB_HOST} user=${POSTGRES_USER} password=${POSTGRES_PASSWORD} dbname=${POSTGRES_DB} port=${DB_PORT} sslmode=${POSTGRES_SSLMODE}"
      PORT: ${BACKEND_PORT}
      JWT_KEY: ${JWT_KEY} 
      JWT_EXPIRE_TIME: ${JWT_EXPIRE_TIME}
      JWT_REFRESH_TIME: ${JWT_REFRESH_TIME}
      RABBITMQ_URL: ${RABBITMQ_URL}
    volumes:
      - file_assets:/assets
    ports:
      - "${BACKEND_PORT}:${BACKEND_PORT}"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_started
    restart: always

  ai-service:
    build:
      context: ./ai
    container_name: inquire-ai-service
    ports:
      - "${AI_SERVICE_PORT:-8001}:${AI_SERVICE_PORT:-8001}"
    environment:
      - DASHSCOPE_API_KEY=${QWEN_API_KEY}
      - DASHSCOPE_APP_ID=${QWEN_APP_ID}
      - PORT=${AI_SERVICE_PORT:-8001}
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: vvechat-frontend
    restart: unless-stopped
    ports:
      - "5173:80"

volumes:
  postgres_data:
  file_assets:
  rabbitmq_data:
